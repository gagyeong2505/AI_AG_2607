        - generic [ref=f16e121]:
          - article [ref=f16e123]:
            - generic [ref=f16e124]: 다양한 표정 사진 보여주며 뇌를 fMRI로 촬영행복한 모습에 오른쪽 측두엽, 꼬리핵 반응부정적 표정 달리 처리, 공포와 분노·슬픔 구분
            - generic [ref=f16e125]:
              - 'img "반려견들은 fMRI 촬영 중 행복, 분노, 두려움, 슬픔을 표현하는 인간의 얼굴 이미지를 봤다. 이때 뇌 활동을 측정해 개들이 얼굴에 나타난 감정을 구별하는 능력을 확인했다./오스트리아 빈대학더 보기출처: Laura" [ref=f16e128]'
              - emphasis [ref=f16e129]: "반려견들은 fMRI 촬영 중 행복, 분노, 두려움, 슬픔을 표현하는 인간의 얼굴 이미지를 봤다. 이때 뇌 활동을 측정해 개들이 얼굴에 나타난 감정을 구별하는 능력을 확인했다./오스트리아 빈대학더 보기출처: Laura V. Cuaya"
            - text: 개는 같이 사는 사람의 감정을 이해하는 동물이다. 단순히 기분이 좋은지, 나쁜지 아는 정도가 아니다. 부정적인 감정의 종류까지 구분한다. 과학자들이 사람의 감정에 따라 개의 뇌가 어떻게 반응하는지 처음으로 확인했다.오스트리아 빈대학 심리학과의 라울 에르난데스-페레즈(Raúl Hernández-Pérez) 교수 연구진은 “반려견들은 미소를 뇌의 특정 영역에서 처리하고, 부정적 표정도 종류별로 구분하는 것으로 나타났다”고 10일(현지 시각) 국제 학술지 ‘아이사이언스’에 발표했다.앞서 연구에서 개들이 인간의 표정을 구별할 수 있다는 사실이 밝혀졌지만, 대부분 긍정적이거나 부정적인 표정만 시험했다. 개들이 다양한 유형의 행복한 표정이나 불행한 표정을 구별할 수 있는지 여부는 명확하지 않았다.
            - generic [ref=f16e130]: 긍정적 표정은 보상 회로에서 반응
            - text: 연구진은 반려견의 뇌를 기능적 자기공명영상(fMRI)으로 촬영했다. 뇌에서 특정 영역이 작동하면 그곳으로 피가 몰린다. fMRI는 해당 영역을 마치 불이 켜진 것처럼 보여준다. fMRI를 쓰면 사람 표정에 개가 반응하는 것을 뇌 차원에서 확인할 수 있다는 의미다.개들은 fMRI 장치 안에서 여러 가지 표정의 사람 사진을 봤다. 첫 번째 실험에서는 개 8마리에게 낯선 사람이 행복한 표정을 짓거나 중립적인 표정이 담긴 사진을 번갈아 보여주고 뇌 활동을 fMRI로 촬영했다. 행복한 얼굴을 보면 개의 뇌에서 오른쪽 측두엽과 꼬리핵이 활성화됐다.귀와 관자놀이 부근의 측두엽은 정보를 처리하고 기억하며 감정을 조절하는 영역이다. 대뇌 깊은 곳에 있는 꼬리핵은 보상 회로와 연관돼 있다. 논문 공동 교신 저자인 로라 쿠아야(Laura Cuaya) 박사는 “이 영역이 반응하는 것은 개가 긍정적인 무언가를 처리하고 있음을 시사한다”고 설명했다.두 번째 실험에서는 개 12마리에게 행복과 분노, 공포, 슬픔을 표현하는 사람들의 사진을 보여주고 뇌 전체에서 일어나는 반응을 인공지능(AI)으로 분석했다. 개의 뇌는 행복한 표정을 부정적 표정 3가지와 60.9~69.8% 정확도로 구별했다. 역시 행복한 표정은 오른쪽 측두엽과 꼬리핵 네트워크에서 반응했다.영국 노팅엄 트렌트대의 브리짓 월러(Bridget Waller) 교수는 “미소는 인간이 가장 흔히 사용하는 표정이며 사회적 상호작용에 필수적이기 때문에, 개들이 인간에 길들여지면서 이를 다른 표정과 구별할 수 있는 능력을 발달시켰다는 설명은 타당하다”고 말했다.
            - generic [ref=f16e132]:
              - img "fMRI로 확인한 개의 인간 표정 인식./자료 iScienc, 챗GPT 생성 이미지" [ref=f16e135]
              - emphasis [ref=f16e136]: fMRI로 확인한 개의 인간 표정 인식./자료 iScienc, 챗GPT 생성 이미지
            - generic [ref=f16e137]: 부정적 감정의 종류까지 구분
            - text: "놀랍게도 개들은 두려움에 찬 표정과 화가 나거나 슬픈 표정을 구분하는 것으로 나타났다. 뇌의 특정 영역만 봐서는 그런 차이를 알 수 없었지만, AI가 전체적인 뇌 활동 형태를 분석하자 구별됐다. 에르난데스 교수는 “서로 다른 부정적 표정이 서로 다른 유형의 위협을 나타내기 때문에 서로 다른 반응을 유발할 수 있다”고 말했다.연구진은 공포감이 사람 얼굴에서 개가 인식할 정도로 두드러지는 표정을 짓게 할 가능성이 있다고 추정했다. 실제로 앞서 연구에서 개가 공포 표정과 중립 표정이 담긴 얼굴 사진을 볼 때 코 부위를 집중적으로 관찰하는 것으로 나타났다. 개가 인간처럼 공포하는 감정 범주를 인식했다기보다, 두려워하는 얼굴에 담긴 시각, 행동 신호가 개에게 상대적으로 더 주의를 끌었을 가능성이 있다.반면 슬픔과 분노는 뇌 전체 활동에서 서로 뚜렷하게 구분되지 않았다. 연구진은 개가 분노와 슬픔을 구분하기에 얼굴만으로는 정보가 부족했다고 추정했다. 앞서 연구에서 개가 인간의 감정을 판단할 때 얼굴보다 몸을 더 관찰하는 것으로 나타났다. 이번처럼 얼굴만 봐서는 슬픈지, 화가 났는지 구별하기 어렵다는 말이다.이번 연구는 개의 뇌가 단순히 좋고 나쁜 표정만 구별하는 게 아니라, 같은 부정적 표정 중에서도 특히 공포를 분노·슬픔과 달리 처리한다는 사실을 fMRI와 AI 기계 학습으로 처음 확인했다. 다만 표본이 적고, 품종도 대부분 보더 콜리였다는 한계가 있다. 그럼에도 이번 연구는 실용적 의미를 갖고 있다. 쿠아야 박사는 “개를 훈련시킬 때 행복한 표정을 지으면 학습 과정에 도움이 될 수 있을 것”이라고 밝혔다.참고 자료iScience(2026), DOI: https://doi.org/10.1016/j.isci.2026.116900"
